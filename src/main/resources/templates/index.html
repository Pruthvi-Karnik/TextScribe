<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Distraction-Free Reader</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --result-bg: #f1f5f9;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --primary: #60a5fa;
            --primary-hover: #3b82f6;
            --result-bg: #090d16;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 1.75rem;
            margin: 0;
            font-weight: 700;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        .theme-toggle:hover {
            background-color: var(--border-color);
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05);
            margin-bottom: 24px;
            transition: background-color 0.3s, border-color 0.3s;
        }

        form {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--card-bg);
            color: var(--text-color);
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
        }

        button[type="submit"] {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button[type="submit"]:hover {
            background-color: var(--primary-hover);
        }

        .meta {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
        }

        .result-box {
            background-color: var(--result-bg);
            padding: 24px;
            border-radius: 8px;
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1.05rem;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Distraction-Free Reader</h1>
        <button class="theme-toggle" onclick="toggleTheme()">🌓 Theme</button>
    </div>

    <div class="card">
        <form action="/clean-ui" method="post">
            <input type="text" name="url" placeholder="Paste article URL here..." required />
            <button type="submit">Clean & Read</button>
        </form>
    </div>

    <!-- Result Display Card -->
    <div class="card" th:if="${response != null}">
        <h2 th:text="${response.title}" style="margin-top: 0; font-size: 1.4rem;"></h2>
        <div class="meta">
            <span>⏱️ <strong th:text="${response.readingTimeMinutes}"></strong> min read</span>
            <span>🔗 <a th:href="${response.sourceUrl}" target="_blank" style="color: var(--primary); text-decoration: none;">Original Source</a></span>
        </div>

        <!-- Typography Controls -->
        <div style="display: flex; gap: 20px; margin-bottom: 15px; align-items: center; font-size: 0.9rem; color: var(--text-muted); border-top: 1px solid var(--border-color); padding-top: 15px;">
            <label>Text Size: <input type="range" min="14" max="24" value="17" onchange="document.querySelector('.result-box').style.fontSize = this.value + 'px'"></label>
            <label>Line Spacing: <input type="range" min="1.4" max="2.4" step="0.1" value="1.7" onchange="document.querySelector('.result-box').style.lineHeight = this.value"></label>
        </div>

        <div class="result-box" th:text="${response.content}"></div>
    </div>

    <!-- Reading History Sidebar Card -->
    <div class="card" th:if="${!#lists.isEmpty(history)}">
        <h3 style="margin-top: 0; font-size: 1.1rem; color: var(--text-muted);">Reading History & Cache</h3>
        <ul style="list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px;">
            <li th:each="page : ${history}">
                <a th:href="@{/clean-ui(url=${page.sourceUrl})}" th:text="${page.title}" style="color: var(--primary); text-decoration: none; font-size: 0.95rem;"></a>
            </li>
        </ul>
    </div>
</div>

<script>
    function toggleTheme() {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('theme', newTheme);
    }

    const savedTheme = localStorage.getItem('theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
</script>
</body>
</html>
